<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manchester United Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--Home Screen-->
    <div class="container">
        <div class="screen" id="start-screen">
            <h1>Quiz Time!</h1>
            <p>Test your knowledge of Manchester United history, players, and legendary moments. Only true fans will
                score 100%!</p>
            <button id="start-btn">Kick Off</button>

        </div>

        <!--Quiz Screen-->
        <div class="screen " id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question Goes here</h2>
                <div class="quiz-info">
                    <p>
                        Question <span id="current-question">1 </span>of <span>5</span>
                    </p>
                    <p>
                        Score: <span id="score">0</span>
                    </p>
                </div>

                <div id="answers-container" class="answers-container">
                    <!---Answer buttons from js-->
                </div>

                <div class="progress-bar">
                    <div id="process" class="progress"></div>
                </div>
            </div>
        </div>

        <!--Final Score Screen-->
        <div id="reult-screen" class="screen active">
            <h1>Quiz Results</h1>
            <div class="result-info">
                <p>You scored <span id="final-score">0 </span>out of <span id="max-score">5</span></p>
                <div id="result-message">Good job!</div>
            </div>
            <button id="restart-btn">Restart Quiz</button>
        </div>


    </div>
</body>

</html>
